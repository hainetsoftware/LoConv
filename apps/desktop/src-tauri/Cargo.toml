[package]
name = "loconv-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "loconv_desktop"
path = "src/lib.rs"

[[bin]]
name = "loconv-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
loconv-contracts = { path = "../../../crates/contracts" }
loconv-engine = { path = "../../../crates/engine" }
tauri = { version = "2", features = [] }

[features]
# Enabled by the Tauri CLI for release builds so bundled assets are embedded.
custom-protocol = ["tauri/custom-protocol"]
