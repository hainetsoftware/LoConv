[package]
name = "loconv-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "loconv_desktop"
path = "src/lib.rs"

[[bin]]
name = "loconv-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
loconv-contracts = { path = "../../../crates/contracts" }
loconv-engine = { path = "../../../crates/engine" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSOpenPanel", "NSSavePanel", "NSPanel", "NSWindow", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[features]
# Enabled by the Tauri CLI for release builds so bundled assets are embedded.
custom-protocol = ["tauri/custom-protocol"]
